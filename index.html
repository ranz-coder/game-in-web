<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Web Clone</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Three.js Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- PointerLockControls untuk First Person Camera ala Minecraft -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <!-- Socket.io -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <!-- Crosshair di tengah layar -->
    <div id="crosshair">+</div>

    <!-- UI Menu -->
    <div id="ui-menu">
        <h1>Web Voxel Game</h1>
        <button id="btn-play">Klik Untuk Bermain</button>
        <p>W, A, S, D = Bergerak | Spasi = Lompat | ESC = Menu / Chat</p>
    </div>

    <!-- UI Chat -->
    <div id="chat-container">
        <div id="chat-messages"></div>
        <input type="text" id="chat-input" placeholder="Tekan ESC lalu klik di sini untuk chat..." autocomplete="off" />
    </div>

    <script src="game.js"></script>
</body>
</html>
